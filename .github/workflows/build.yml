name: Build
run-name: Build ${{ inputs.version }} (${{ github.ref_name }})

#[push]
on: 
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 0.0.1

# pushing is done separately by publish.yml
permissions:
  contents: read

jobs:
  native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          # pinned: shipped binaries inherit the build machine's glibc/libstdc++ minimum version
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: pwsh native/build.ps1 -Arch ${{ matrix.arch }}

      - name: Upload native libraries
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          # common root is src/YG/, so the artifact contains runtimes/ and staticlibs/
          path: |
            src/YG/runtimes/
            src/YG/staticlibs/
          if-no-files-found: error

  pack:
    needs: native        # waits for all matrix jobs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true        # merges into a single folder
          path: src/YG/

      - name: Pack NuGet
        run: dotnet pack src/YG/Enyim.YG.csproj -c Release -p:Version=${{ inputs.version }}

      - name: Upload NuGet package
        uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: "**/*.nupkg"

      - name: Summary
        run: |
          echo "Packed **Enyim.YG ${{ inputs.version }}**." >> $GITHUB_STEP_SUMMARY
          echo "Once all jobs pass, push it by running the **Publish** workflow with run ID \`${{ github.run_id }}\`." >> $GITHUB_STEP_SUMMARY

  # publish a small app with Native AOT on every platform, so static linking problems
  # (CRT mismatch, missing C++ runtime, non-PIC objects) fail here instead of in consumers' builds
  aot-smoke:
    needs: pack
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: feed/

      - name: Publish with Native AOT
        shell: pwsh
        run: |
          $feed = (Get-ChildItem feed -Recurse -Filter *.nupkg | Select-Object -First 1).DirectoryName
          dotnet publish tests/AotSmoke/AotSmoke.csproj -c Release -r ${{ matrix.rid }} -o smoke `
            -p:PublishAot=true -p:EnyimYGVersion=${{ inputs.version }} -p:RestoreAdditionalProjectSources=$feed
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify static linking
        shell: pwsh
        run: |
          $dynamic = Get-ChildItem smoke -Filter '*yoga*'
          if ($dynamic) { Write-Error "Dynamic yoga library found in publish output: $dynamic"; exit 1 }
          ./smoke/AotSmoke
          if ($LASTEXITCODE -ne 0) { Write-Error "AotSmoke failed ($LASTEXITCODE)"; exit 1 }
